<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=open_in_browser" />
</head>
<body>

  <!-- Background layer (image / gradient) -->
  <div id="bg-layer"></div>

  <!-- ── TOP BAR ────────────────────────────────────────────── -->
  <header id="top-bar">
    <div id="weather-widget" class="hidden">
      <span id="weather-icon">☀️</span>
      <span id="weather-temp">--°</span>
      <span id="weather-desc">--</span>
    </div>
    <div id="top-bar-right">
      <button id="focus-toggle-btn" title="Toggle Focus Mode">🎯</button>
      <button id="settings-btn" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- ── FOCUS MODE BANNER ──────────────────────────────────── -->
  <div id="focus-banner" class="hidden">
    <span id="focus-label">🎯 Focus Mode — </span>
    <span id="focus-timer">00:00</span>
    <button id="focus-end-btn">End</button>
  </div>

  <!-- ── MAIN CONTENT ───────────────────────────────────────── -->
  <main id="main">

    <!-- Clock -->
    <section id="clock-section">
      <div id="clock">00:00</div>
      <div id="date">Monday, January 1</div>
      <div id="greeting">Good morning</div>
    </section>

    <!-- Search bar -->
    <section id="search-section">
      <form id="search-form">
        <div id="search-wrapper">
          <input
            id="search-input"
            type="text"
            placeholder="Search or enter a URL…"
            autocomplete="off"
            autofocus
          />
          <button type="submit" id="search-submit" aria-label="Search">→</button>
        </div>
      </form>
      <div id="search-shortcut-hints" class="hidden"></div>
    </section>

    <!-- Favourite Tabs -->
    <section id="favtabs-section">
      <div id="favtabs-grid">
        <!-- Add button lives inside the grid as the last tile -->
        <div class="topsite-item favtabs-add-tile" id="favtabs-add-btn" title="Add favourite tab">
          <div class="topsite-favicon favtabs-add-icon">＋</div>
          <span class="topsite-label">Add</span>
        </div>
      </div>
      <!-- Inline add form -->
      <div id="favtabs-form" class="favtabs-form hidden">
        <input id="favtabs-url"  type="text" placeholder="URL, e.g. github.com" autocomplete="off" />
        <span id="favtabs-url-error" class="favtabs-url-error hidden"></span>
        <input id="favtabs-name" type="text" placeholder="Name (optional)" autocomplete="off" />
        <div class="favtabs-form-actions">
          <button id="favtabs-save-btn"   type="button">Add</button>
          <button id="favtabs-cancel-btn" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <!-- Top Sites -->
    <section id="topsites-section">
      <div id="topsites-grid"></div>
    </section>

    <!-- ── BOTTOM PANELS ─────────────────────────────────────── -->
    <div id="panels">

      <div class="panel" id="todo-panel">
        <h3 class="panel-title">Tasks</h3>
        <form id="todo-form">
          <input id="todo-input" type="text" placeholder="Add a task…" autocomplete="off" />
          <button type="submit">+</button>
        </form>
        <span id="todo-input-error" class="todo-input-error hidden"></span>
        <ul id="todo-list"></ul>
      </div>

      <!-- Notes panel -->
      <div class="panel" id="notes-panel">
        <h3 class="panel-title">Notes</h3>
        <textarea id="notes-area" placeholder="Jot something down…" spellcheck="false"></textarea>
      </div>

    </div>
  </main>



  <!-- Scripts (module order matters) -->
  <script src="js/storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/search.js"></script>
  <script src="js/topsites.js"></script>
  <script src="js/favtabs.js"></script>
  <script src="js/todo.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
