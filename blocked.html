<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked — Focus Mode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29 0%, #1a1a4e 50%, #24243e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f0f0f0;
      text-align: center;
      padding: 20px;
      gap: 20px;
    }
    .bolt { font-size: 5rem; line-height: 1; }
    h1 { font-size: 2rem; font-weight: 700; }
    p  { color: rgba(240,240,240,0.6); font-size: 1rem; max-width: 380px; line-height: 1.6; }
    .site {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 6px 18px;
      font-family: monospace;
      font-size: 1rem;
      color: #ffd200;
    }
    button {
      margin-top: 8px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border: none;
      border-radius: 999px;
      color: #1a1a1a;
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 28px;
      cursor: pointer;
    }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="bolt">⚡</div>
  <h1>Focus Mode Active</h1>
  <p>You blocked this site to stay focused. Come back later — you've got things to do.</p>
  <div class="site" id="blocked-url"></div>
  <button onclick="history.back()">← Go Back</button>
  <script>
    const url = new URL(location.href);
    const blocked = url.searchParams.get("url") || document.referrer || location.hostname;
    document.getElementById("blocked-url").textContent =
      blocked ? new URL(blocked.startsWith("http") ? blocked : "https://" + blocked).hostname : "this site";
  </script>
</body>
</html>
